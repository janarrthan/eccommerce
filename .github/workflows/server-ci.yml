name: Server CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  unit:
    name: Static checks and database-free unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # This SHA pins v7.0.1.
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # This SHA pins v7.0.0.
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Generate Prisma Client without connecting to a database
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:1/generation_only
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
        env:
          NODE_ENV: test

  integration:
    name: Parallel PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://eccommerce_test:eccommerce_test@localhost:5432/eccommerce_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eccommerce_test
          POSTGRES_PASSWORD: eccommerce_test
          POSTGRES_DB: eccommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eccommerce_test -d eccommerce_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # This SHA pins v7.0.1.
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # This SHA pins v7.0.0.
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Provision migrated worker schemas and run integration tests
        run: npm run test:integration
      - name: Destroy the disposable PostgreSQL service
        if: always()
        run: docker rm --force "${{ job.services.postgres.id }}"
